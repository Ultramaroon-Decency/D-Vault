# ==============================================================================
# D-Vault Local Development Environment (Docker Compose)
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: d-vault-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sih_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sih_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - d-vault-network

  # ----------------------------------------------------------------------------
  # 2. Backend API Service (Express + Prisma + TypeScript)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: d-vault-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:password@postgres:5432/sih_db?schema=public
      CORS_ORIGIN: http://localhost:3000
    networks:
      - d-vault-network

  # ----------------------------------------------------------------------------
  # 3. Frontend Service (Next.js — Active frontend)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: d-vault-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - path: ./frontend/.env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:5000
    networks:
      - d-vault-network

  # ----------------------------------------------------------------------------
  # 4. Smart Contracts (Local Hardhat Node)
  # ----------------------------------------------------------------------------
  hardhat:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    container_name: d-vault-hardhat
    restart: unless-stopped
    ports:
      - "8545:8545"
    environment:
      - HARDHAT_NETWORK=localhost
    networks:
      - d-vault-network

volumes:
  postgres_data:
    name: d-vault-postgres-data

networks:
  d-vault-network:
    name: d-vault-network
    driver: bridge
