# ==============================================================================
# D-Vault Local Development Environment (Docker Compose)
#
# SECURITY CHANGES:
#  - PostgreSQL password moved to POSTGRES_PASSWORD env var (VULN-10)
#  - PostgreSQL host port mapping removed — DB only accessible via internal network (VULN-11)
#  - Redis service added for shared rate-limiter state
#  - Backend container runs as non-root via Dockerfile USER directive (VULN-12)
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # SECURITY: Port NOT exposed to host — only reachable via d-vault-network (VULN-11)
  # SECURITY: Password injected from env var, not hardcoded (VULN-10)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: d-vault-postgres
    restart: unless-stopped
    # SECURITY: No host port mapping — DB only accessible within Docker network
    # ports:
    #   - "5432:5432"   ← removed to prevent direct DB access from host
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in your .env or shell environment}
      POSTGRES_DB: sih_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sih_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - d-vault-network

  # ----------------------------------------------------------------------------
  # 2. Redis (shared rate-limiter store — prevents bypass via multi-instance scaling)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: d-vault-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    networks:
      - d-vault-network

  # ----------------------------------------------------------------------------
  # 3. Backend API Service (Express + Prisma + TypeScript)
  # SECURITY: Runs as non-root user (set in Dockerfile) (VULN-12)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: d-vault-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/sih_db?schema=public
      CORS_ORIGIN: http://localhost:3000
      REDIS_URL: redis://redis:6379
    networks:
      - d-vault-network

  # ----------------------------------------------------------------------------
  # 4. Frontend Service (Next.js + Tailwind)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: d-vault-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - path: ./frontend/.env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:5000
    networks:
      - d-vault-network

  # ----------------------------------------------------------------------------
  # 5. Smart Contracts (Local Hardhat Node)
  # ----------------------------------------------------------------------------
  hardhat:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    container_name: d-vault-hardhat
    restart: unless-stopped
    ports:
      - "8545:8545"
    environment:
      - HARDHAT_NETWORK=localhost
    networks:
      - d-vault-network

volumes:
  postgres_data:
    name: d-vault-postgres-data

networks:
  d-vault-network:
    name: d-vault-network
    driver: bridge
