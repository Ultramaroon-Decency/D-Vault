# ==============================================================================
# Frontend Preview Deployment (Vercel)
#
# Deploys frontend-web3/ to Vercel on every Pull Request modifying frontend code.
# Builds with NEXT_PUBLIC_USE_MOCK_DATA=true so it functions independently of
# live contracts and live backend endpoints.
# ==============================================================================

name: Frontend Preview Deployment

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'frontend-web3/**'
      - '.github/workflows/deploy-frontend-preview.yml'

jobs:
  deploy-preview:
    name: Deploy Preview to Vercel
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-web3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-web3/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify Vercel Credentials
        id: check-credentials
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::warning::VERCEL_TOKEN secret is not configured or unavailable in this context (e.g. PR from a fork). Skipping Vercel preview deployment."
            echo "### ⚠️ Vercel Preview Skipped" >> $GITHUB_STEP_SUMMARY
            echo "The \`VERCEL_TOKEN\` secret is not set in repository secrets or is unavailable due to fork PR security restrictions. Configure \`VERCEL_TOKEN\`, \`VERCEL_ORG_ID\`, and \`VERCEL_PROJECT_ID\` in repository secrets to enable preview deployments." >> $GITHUB_STEP_SUMMARY
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Vercel CLI
        if: steps.check-credentials.outputs.has_token == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        if: steps.check-credentials.outputs.has_token == 'true'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        if: steps.check-credentials.outputs.has_token == 'true'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_USE_MOCK_DATA: 'true'

      - name: Deploy Project Artifacts to Vercel
        if: steps.check-credentials.outputs.has_token == 'true'
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "### 🚀 Vercel Preview Deployed" >> $GITHUB_STEP_SUMMARY
          echo "**Preview URL**: $DEPLOYMENT_URL" >> $GITHUB_STEP_SUMMARY
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment Preview URL on PR
        uses: actions/github-script@v7
        if: steps.check-credentials.outputs.has_token == 'true' && steps.deploy.outputs.preview_url != ''
        with:
          script: |
            const url = "${{ steps.deploy.outputs.preview_url }}";
            if (url && context.issue.number) {
              const body = `### 🚀 Frontend Preview Deployed\n\nPreview is ready for review:\n- **URL**: [${url}](${url})\n- **Mode**: Mock Data Enabled (\`NEXT_PUBLIC_USE_MOCK_DATA=true\`)`;
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
